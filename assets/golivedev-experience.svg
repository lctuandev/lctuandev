<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360"><stop stop-color="#111827"/><stop offset=".55" stop-color="#312E81"/><stop offset="1" stop-color="#581C87"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <style>
      .txt{font-family:Segoe UI,Arial,sans-serif}
    </style>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <circle cx="940" cy="80" r="130" fill="#A78BFA" opacity=".18" filter="url(#soft)"/>
  <circle cx="1080" cy="310" r="110" fill="#22D3EE" opacity=".12" filter="url(#soft)"/>

  <g opacity=".8">
    <rect x="790" y="58" width="285" height="55" rx="14" fill="#FFFFFF" opacity=".13" stroke="#C4B5FD"/>
    <rect x="820" y="77" width="120" height="10" rx="5" fill="#C4B5FD"/>
    <rect x="958" y="77" width="76" height="10" rx="5" fill="#67E8F9"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; -30 20; 0 0" dur="4s" repeatCount="indefinite"/>
  </g>
  <g opacity=".9">
    <rect x="835" y="140" width="145" height="145" rx="18" fill="#FFFFFF" opacity=".12" stroke="#C4B5FD"/>
    <rect x="858" y="165" width="75" height="12" rx="6" fill="#C4B5FD"/>
    <rect x="858" y="195" width="98" height="9" rx="4" fill="#DDD6FE" opacity=".8"/>
    <rect x="858" y="219" width="58" height="9" rx="4" fill="#DDD6FE" opacity=".55"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 35 -12; 0 0" dur="5s" repeatCount="indefinite"/>
  </g>
  <g opacity=".75">
    <rect x="1005" y="158" width="120" height="90" rx="16" fill="#FFFFFF" opacity=".12" stroke="#67E8F9"/>
    <rect x="1025" y="181" width="64" height="10" rx="5" fill="#67E8F9"/>
    <rect x="1025" y="208" width="82" height="8" rx="4" fill="#BAE6FD" opacity=".7"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; -22 35; 0 0" dur="4.5s" repeatCount="indefinite"/>
  </g>
  <g opacity=".7">
    <rect x="755" y="255" width="210" height="48" rx="14" fill="#FFFFFF" opacity=".11" stroke="#C4B5FD"/>
    <rect x="778" y="274" width="152" height="10" rx="5" fill="#A78BFA"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 45 -28; 0 0" dur="6s" repeatCount="indefinite"/>
  </g>

  <path d="M735 120 C835 70, 925 150, 1040 105" stroke="#DDD6FE" stroke-width="2" stroke-dasharray="8 10" opacity=".65">
    <animate attributeName="stroke-dashoffset" values="0;-80" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M775 310 C870 250, 990 330, 1115 245" stroke="#67E8F9" stroke-width="2" stroke-dasharray="8 10" opacity=".6">
    <animate attributeName="stroke-dashoffset" values="0;-80" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <g transform="translate(70 62)">
    <text class="txt" x="0" y="0" fill="#C4B5FD" font-size="18" font-weight="700" letter-spacing="3">EXPERIENCE / SAAS BUILDER</text>
    <text class="txt" x="0" y="52" fill="#F8FAFC" font-size="44" font-weight="800">GOLIVEDEV</text>
    <text class="txt" x="0" y="88" fill="#DDD6FE" font-size="22" font-weight="600">Frontend Developer · Oct 2024 - Aug 2025</text>
    <text class="txt" x="0" y="137" fill="#E5E7EB" font-size="20">Built drag-and-drop bio page builder, community system, real-time chat,</text>
    <text class="txt" x="0" y="168" fill="#E5E7EB" font-size="20">role management, notifications, and multi-product selling features.</text>
    <g transform="translate(0 215)">
      <rect width="100" height="34" rx="17" fill="#8B5CF6" fill-opacity=".2" stroke="#C4B5FD"/><text class="txt" x="20" y="23" fill="#F5F3FF" font-size="14" font-weight="700">VueJS</text>
      <rect x="115" width="105" height="34" rx="17" fill="#8B5CF6" fill-opacity=".2" stroke="#C4B5FD"/><text class="txt" x="135" y="23" fill="#F5F3FF" font-size="14" font-weight="700">NuxtJS</text>
      <rect x="235" width="120" height="34" rx="17" fill="#8B5CF6" fill-opacity=".2" stroke="#C4B5FD"/><text class="txt" x="255" y="23" fill="#F5F3FF" font-size="14" font-weight="700">Tailwind</text>
      <rect x="370" width="105" height="34" rx="17" fill="#8B5CF6" fill-opacity=".2" stroke="#C4B5FD"/><text class="txt" x="390" y="23" fill="#F5F3FF" font-size="14" font-weight="700">REST API</text>
    </g>
  </g>
