<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360"><stop stop-color="#052E2B"/><stop offset=".5" stop-color="#064E3B"/><stop offset="1" stop-color="#0F172A"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.txt{font-family:Segoe UI,Arial,sans-serif}</style>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <circle cx="950" cy="185" r="130" fill="#34D399" opacity=".12"/>
  <circle cx="950" cy="185" r="82" fill="none" stroke="#6EE7B7" opacity=".35"/>
  <circle cx="950" cy="185" r="48" fill="none" stroke="#67E8F9" opacity=".35"/>

  <g filter="url(#glow)" class="txt" font-weight="700">
    <text x="810" y="80" fill="#BBF7D0" font-size="22">Speaking<animateTransform attributeName="transform" type="translate" values="0 0;25 18;0 0" dur="5s" repeatCount="indefinite"/></text>
    <text x="1010" y="95" fill="#A7F3D0" font-size="18">Fluency<animateTransform attributeName="transform" type="translate" values="0 0;-25 24;0 0" dur="4.5s" repeatCount="indefinite"/></text>
    <text x="760" y="245" fill="#67E8F9" font-size="19">Vocabulary<animateTransform attributeName="transform" type="translate" values="0 0;20 -24;0 0" dur="5.8s" repeatCount="indefinite"/></text>
    <text x="1015" y="270" fill="#D9F99D" font-size="18">Pronunciation<animateTransform attributeName="transform" type="translate" values="0 0;-32 -18;0 0" dur="6s" repeatCount="indefinite"/></text>
    <text x="875" y="305" fill="#A7F3D0" font-size="17">Mock Test<animateTransform attributeName="transform" type="translate" values="0 0;30 -12;0 0" dur="4.8s" repeatCount="indefinite"/></text>
    <text x="1070" y="170" fill="#BAE6FD" font-size="17">AI Teacher<animateTransform attributeName="transform" type="translate" values="0 0;-18 28;0 0" dur="5.2s" repeatCount="indefinite"/></text>
  </g>

  <g transform="translate(920 185)" filter="url(#glow)">
    <rect x="-30" y="-52" width="60" height="104" rx="30" fill="#ECFDF5" opacity=".92"/>
    <rect x="-11" y="-70" width="22" height="140" rx="11" fill="#10B981" opacity=".9">
      <animate attributeName="height" values="90;140;90" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-45;-70;-45" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <path d="M-70 15 C-45 -20,-25 52,0 5 S45 -20,70 15" stroke="#67E8F9" stroke-width="4" fill="none">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M-70 15 C-45 -20,-25 52,0 5 S45 -20,70 15;M-70 5 C-45 45,-25 -35,0 15 S45 45,70 5;M-70 15 C-45 -20,-25 52,0 5 S45 -20,70 15"/>
    </path>
  </g>

  <g transform="translate(70 62)">
    <text class="txt" x="0" y="0" fill="#6EE7B7" font-size="18" font-weight="700" letter-spacing="3">EXPERIENCE / AI EDUCATION</text>
    <text class="txt" x="0" y="52" fill="#F8FAFC" font-size="44" font-weight="800">FIKA IELTS</text>
    <text class="txt" x="0" y="88" fill="#BBF7D0" font-size="22" font-weight="600">Frontend Mobile Developer · Nov 2023 - Jul 2024</text>
    <text class="txt" x="0" y="137" fill="#D1FAE5" font-size="20">Launched an AI-powered IELTS Speaking app with vocabulary expansion,</text>
    <text class="txt" x="0" y="168" fill="#D1FAE5" font-size="20">pronunciation feedback, mock speaking tests, progress tracking, and recommendations.</text>
    <g transform="translate(0 215)">
      <rect width="150" height="34" rx="17" fill="#10B981" fill-opacity=".18" stroke="#6EE7B7"/><text class="txt" x="20" y="23" fill="#ECFDF5" font-size="14" font-weight="700">React Native</text>
      <rect x="165" width="115" height="34" rx="17" fill="#10B981" fill-opacity=".18" stroke="#6EE7B7"/><text class="txt" x="185" y="23" fill="#ECFDF5" font-size="14" font-weight="700">Firebase</text>
      <rect x="295" width="155" height="34" rx="17" fill="#10B981" fill-opacity=".18" stroke="#6EE7B7"/><text class="txt" x="315" y="23" fill="#ECFDF5" font-size="14" font-weight="700">Cloud Firestore</text>
      <rect x="465" width="95" height="34" rx="17" fill="#10B981" fill-opacity=".18" stroke="#6EE7B7"/><text class="txt" x="485" y="23" fill="#ECFDF5" font-size="14" font-weight="700">AI App</text>
    </g>
  </g>
</svg>
